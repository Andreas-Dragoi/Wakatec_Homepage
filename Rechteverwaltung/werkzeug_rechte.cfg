; =============================================================================
; WAKATEC INSPECT – WERKZEUG-RECHTE (Operator-Liste)
; =============================================================================
; Diese Datei bestimmt, welche Werkzeuge welche Nutzerstufe sehen darf.
; Das Programm lädt sie beim Start (src/rechte.gd) und wendet sie bei jeder
; Lizenzänderung bzw. Anmeldung an. Sie kann nur ENGER machen, nie öffnen:
; Werkzeuge behalten zusätzlich ihre fest eingebauten Prüfungen
; (Vollversion/Partner/Entwickler).
;
; STUFEN (Wert je Werkzeug, IMMER in Anführungszeichen):
;   "demo"      – jeder, auch ohne Lizenz/Anmeldung (Demo-Version)
;   "kunde"     – mit Lizenz (Desktop) bzw. Anmeldung (Browser): Kunden
;   "partner"   – Partner und Entwickler (seit 2.4.8; Rolle „partner“ der
;                 Lizenz bzw. Partner-Abschnitt der Zugangsliste)
;   "dev"       – nur Entwickler (Rolle „dev“ bzw. Developer-Abschnitt)
;   "gesperrt"  – für niemanden sichtbar (Werkzeug vorübergehend abschalten)
;   Die Stufen bauen aufeinander auf: demo < kunde < partner < dev. In der
;   Demo ist nur Stufe "demo" bedienbar; "kunde" bleibt sichtbar, aber gesperrt.
;   ("frei"/"voll" sind alte Schreibweisen und gelten als "kunde".)
;   ACHTUNG "partner": Programmfassungen VOR 2.4.8 kennen die Stufe nicht und
;   zeigen solche Werkzeuge allen angemeldeten Kunden. Erst verwenden, wenn
;   alle Kunden auf 2.4.8 oder neuer sind (der Browser-Viewer ist immer aktuell).
;
; PFLEGE:
;   - Wert ändern, Datei speichern – beim nächsten Programmstart aktiv.
;   - Neue Werkzeuge: Zeile im passenden Abschnitt ergänzen; die ID muss im
;     Code verdrahtet sein (siehe _apply_license_state in src/main.gd).
;   - Zeilen mit ";" am Anfang sind Kommentare.
;   - Jede Werkzeug-ID darf nur EINMAL vorkommen.
;
; ZENTRALE VERTEILUNG (ohne neue Programmversion):
;   Das Programm fragt bei jedem Start die in src/rechte.gd hinterlegte
;   REMOTE_URL (Datei werkzeug_rechte.cfg im Homepage-Repository) ab,
;   merkt sich den letzten erfolgreichen Stand als Cache (funktioniert also
;   auch offline) und fällt ohne Internet auf diese mitgelieferte Datei
;   zurück. Zum Aktualisieren einfach die Datei dort überschreiben.
;
; EXPORT-HINWEIS: Damit die Datei im fertigen Build enthalten ist, muss im
; Godot-Export unter „Ressourcen“ der Filter  *.cfg  eingetragen sein.
; =============================================================================

; =============================================================================
; LINKE WERKZEUGLEISTE
; =============================================================================

[linke_leiste]

; ＋  Daten importieren (LAS/LAZ, OBJ, PLY, Fotos …)
import="kunde"

; ▤  Projekt (neu, öffnen, speichern)
project="kunde"

; ◐  Darstellung (Punktgröße, Dichte, Gitter, EDL)
display="kunde"

; ▦  Oberfläche (Karte, Wasser, Himmel, Beschriftungen, Position)
map="kunde"

; ―  Höhen-Hilfslinie (Referenzebene)
guide="kunde"

; ↔  Transformation (Versatz, Rotation, Skalierung, Y/Z-Achse)
transform="dev"

; ◆  Notizen / Markierungen (Befunde im Modell)
notes="kunde"

; ⚙  Entwickler-Werkzeuge (Arbeitsschritte ①–⑥)
devtools="dev"

; =============================================================================
; UNTERE WERKZEUGLEISTE
; =============================================================================

[untere_leiste]

; ◎ ▽ ◁ ⟲  Ansicht (Orbit, Oben, Seite, Zurücksetzen) – fest frei,
; nur zur Dokumentation aufgeführt
ansicht="demo"

; △  Messen (Distanz + Höhenunterschied)
messen="partner"

; ▣  Clipping (Ausschnitt-Box je Ebene)
clip="dev"

; ☀  Licht (frei platzierbare Sonne)
licht="kunde"

; ▧  Höhenfarben (Farbskala ein-/ausblenden)
hoehenfarben="kunde"

; ◢  Höhenprofil-Schnitt (P1–P16, Vorhang, Differenz, WSP)
profil="kunde"

; ▥  Raster-Schnitt (2–16 Profile auf einmal)
raster="partner"

; ◫  Split-Vergleich (vorher/nachher)
split="kunde"

; ◉  Foto (Screenshot als PNG)
foto_screenshot="kunde"

; ◳ Bauwerksvergleich (Zeitvergleich, Differenz-Heatmap, Hinweisbereiche) – automatisierte VORANALYSE, ersetzt keine fachliche Prüfung
zwilling="dev"

; =============================================================================
; RECHTES DOCK
; =============================================================================

[rechtes_dock]

; ≡  Ebenenliste (Sichtbarkeit, Farbe, Löschen)
ebenen="kunde"

; ▤  Eigenschaften (je Ebene: Höhenfarben, Anomalie, Skalierung …)
eigenschaften="kunde"

; =============================================================================
; OBERFLÄCHE – UNTER-WERKZEUGE
; =============================================================================

[oberflaeche]

; ▦ Karte als Grundfläche (basemap.at / OSM)
karte="kunde"

; ≈ Wasseroberfläche (animiert, Wasserspiegel)
wasser="kunde"

; ☁ Himmel (Wolken, Tageslicht)
himmel="kunde"

; ✦ Beschriftungen (Ortsnamen als 3D-Schilder)
beschriftungen="kunde"

; ◎ Position (Koordinaten-Anzeige)
position="kunde"

; =============================================================================
; ENTWICKLER-PANEL ①–⑥
; =============================================================================

[entwickler_panel]

; ① ◈  Bezugssystem: ◎ aus den Daten erkennen
crs_erkennen="partner"

; ② ◔  Aufnahme dokumentieren: ◎ Felder automatisch füllen
meta_auto="dev"

; ② ◔  🌊 Abflussdaten abrufen (Open-Meteo/GloFAS)
abflussdaten="dev"

; ③ 📷  Drohnenfotos einbinden (Fotoliste, Pins, Auto-Aufnahmen)
fotoliste="dev"

; ④ ▤  Einsatzbericht (PDF-Vorschau und -Export)
bericht="dev"

; ⑤ ⇉  Übergabe: komplettes Übergabepaket (DXF, LandXML, Befund-CSV, Raster-DGM,
;      Höhenprofile, Querprofile, .waka, LIESMICH) – seit 2.4.8 der einzige Export
uebergabepaket="dev"

; ⑥ ◍  Web-Vorschau (ausgedünntes Browser-Paket)
web_export="dev"

; ◫  Sonar-Bildwand (eigene Kachel seit 2.4.8): Mosaik am Pfeiler unter Wasser,
;    Bildausschnitt (Rechteck/Lasso), Bearbeitungsfenster
bildwand="dev"

; ◱ RealityImage: Drohnenfotos für RealityScan prüfen, auswählen, kopieren
realityimage="dev"

; ▧ Höhenlinien (topografisch, mit Höhenzahlen und Hoch-/Tiefpunkten)
hoehenlinien="partner"

; =============================================================================
; NEU GEFUNDEN (AUS DEM GODOT-PROJEKT)
; =============================================================================

[neu_gefunden]

; Automatisch aus dem Godot-Projekt übernommen – Beschreibung ergänzen
kamerafahrt="partner"

; =============================================================================
; EXPORT-FENSTER (Knopf oben rechts, seit 3.0.0 / 10.10.2026)
; =============================================================================
; Jede Karte im Export-Fenster hat eine eigene ID. Was eine Stufe hier nicht
; sehen darf, erscheint gar nicht – es gibt im Export KEINE gesperrten Karten
; (Nutzerregel 13.10.2026). Ist für einen Zugang kein einziges Format frei,
; fehlt auch der Export-Knopf in der Kopfleiste; in der Demo ist Export aus.
; Browser-Viewer und Desktop lesen dieselbe Liste.

[export]

; ▤ WAKATEC-Datenpaket .waka (Desktop, volle Auflösung)
export_waka_desktop="kunde"

; ◍ Datenpaket für den Online-Viewer (_Web.waka, ausgedünnt ≤ 600 MB)
export_waka_web="kunde"

; ● LAS-Punktwolke (LAS 1.2, Punktformat 2, GeoKeys) – CloudCompare, QGIS, PDAL
export_las="partner"

; ● LAZ-Punktwolke (wie LAS, mit laszip64.exe gepackt)
export_laz="partner"

; ● Textpunktwolke .txt (E N H R G B I)
export_xyz="dev"

; ▦ Raster-DGM als GeoTIFF (+ ESRI-ASCII .asc/.prj)
export_geotiff="dev"

; ▲ LandXML-Geländemodell (TIN)
export_landxml="partner"

; ✎ DXF-Zeichnung R12 (Befunde, Messungen, Profile, Höhenlinien, Bildwände)
export_dxf="partner"

; ◈ Shapefiles (Befunde, Messungen, Profile, Höhenlinien mit Attributen)
export_shp="dev"

; ◈ GeoPackage (alle GIS-Ebenen in einer Datei)
export_gpkg="dev"

; ≡ Befundliste .csv + Fotos/
export_csv="dev"

; ◢ Höhen- und Querprofile .csv
export_profile="partner"

; ▤ Einsatzbericht .pdf
export_bericht="dev"
