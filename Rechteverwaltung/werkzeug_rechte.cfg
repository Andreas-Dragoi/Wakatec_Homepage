; =============================================================================
; WAKATEC INSPECT – WERKZEUG-RECHTE (Operator-Liste)
; =============================================================================
; Diese Datei bestimmt, welche Werkzeuge welche Nutzerstufe sehen darf.
; Das Programm lädt sie beim Start (src/rechte.gd) und wendet sie bei jeder
; An-/Abmeldung an. Sie kann nur ENGER machen, nie öffnen: Werkzeuge behalten
; zusätzlich ihre fest eingebauten Prüfungen (Vollversion/Entwickler).
;
; STUFEN (Wert je Werkzeug, IMMER in Anführungszeichen):
;   "frei"      – jeder, auch ohne Anmeldung (freie Version)
;   "voll"      – erst nach Anmeldung mit Vollversions-Zugang (Kunden)
;   "dev"       – nur Entwickler (Developer-Abschnitt der Zugangsliste)
;   "gesperrt"  – für niemanden sichtbar (Werkzeug vorübergehend abschalten)
;
; PFLEGE:
;   - Wert ändern, Datei speichern – beim nächsten Programmstart aktiv.
;   - Neue Werkzeuge: Zeile im passenden Abschnitt ergänzen; die ID muss im
;     Code verdrahtet sein (siehe _apply_license_state in src/main.gd).
;   - Zeilen mit ";" am Anfang sind Kommentare.
;
; SUPABASE (zentrale Verteilung ohne neue Programmversion):
;   1. In Supabase einen öffentlichen Storage-Bucket anlegen, z. B. "konfig".
;   2. Diese Datei dort hochladen (gleicher Name: werkzeug_rechte.cfg).
;   3. In src/rechte.gd die Konstante REMOTE_URL setzen:
;      https://<projekt>.supabase.co/storage/v1/object/public/konfig/werkzeug_rechte.cfg
;   4. Das Programm fragt die URL bei jedem Start ab, merkt sich den letzten
;      erfolgreichen Stand als Cache (funktioniert also auch offline) und
;      fällt ohne Internet auf diese mitgelieferte Datei zurück.
;   Zum Aktualisieren einfach die Datei im Bucket überschreiben.
;
; EXPORT-HINWEIS: Damit die Datei im fertigen Build enthalten ist, muss im
; Godot-Export unter „Ressourcen“ der Filter  *.cfg  eingetragen sein.
