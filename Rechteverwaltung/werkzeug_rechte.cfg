; =============================================================================
; WAKATEC INSPECT – WERKZEUG-RECHTE (Operator-Liste)
; =============================================================================
; Diese Datei bestimmt, welche Nutzerstufe welches Werkzeug sieht und bedient.
; Das Programm lädt sie beim Start (src/rechte.gd) und wendet sie bei jeder
; An-/Abmeldung an; der Browser-Viewer liest dieselbe Liste.
; STEHT EIN WERKZEUG IN DER LISTE, ENTSCHEIDET DIE LISTE – sie kann ein
; Werkzeug also auch für eine niedrigere Stufe freigeben. Nicht gelistete
; Werkzeuge behalten ihr eingebautes Verhalten; in der Demo sind sie verborgen.
;
; STUFEN (aufeinander aufbauend, Wert IMMER in Anführungszeichen):
;   "demo"      – auch in der Demo-Version bedienbar (sehen alle Stufen)
;   "kunde"     – mit Lizenz (Desktop) bzw. Anmeldung (Browser); in der Demo
;                 sichtbar, aber gesperrt
;   "partner"   – Partner und Entwickler
;   "dev"       – nur Entwickler
;   "gesperrt"  – für niemanden sichtbar
;
; FACHWERKZEUGE (Panel): Die Kacheln im Abschnitt [entwickler_panel] erreicht nur,
; wer auch "devtools" hat. Kacheln, deren Inhalt die Stufe nicht hat (Bericht,
; Übergabe, Web-Vorschau, RealityImage …), bleiben verborgen. Gilt in Programm
; und Browser-Viewer ab Stand r78-N73 (38); ältere Fassungen öffnen das Panel
; nur für Entwickler.
;
; PFLEGE: tools/rechte-verwaltung.html öffnen, Stufen wählen, exportieren.
;   1. Die exportierte Datei im GitHub-Repo Wakatec_Homepage unter
;      Rechteverwaltung/werkzeug_rechte.cfg ersetzen – wirkt beim nächsten
;      Programmstart bzw. Laden des Viewers (zentraler Stand, legt sich je
;      Werkzeug über die mitgelieferte Datei).
;   2. tools/werkzeug_rechte.cfg im Projekt ebenfalls ersetzen – das ist der
;      Grundstock im nächsten Build (export_presets.cfg schließt sie ein).
;   3. Danach die Handbücher neu bauen (Export-Handbuch, Bedienungsanleitungen)
;      und die Homepage-Texte prüfen – sie nennen den Umfang der Stufe Kunde.
; =============================================================================

; =============================================================================
; LINKE WERKZEUGLEISTE
; =============================================================================

[linke_leiste]

; ＋ Daten importieren (LAS/LAZ, E57, OBJ, PLY, GeoTIFF, DXF, Shapefile …)
import="kunde"

; ▤ Projekt (neu, öffnen, speichern, Cache leeren)
project="kunde"

; ◐ Darstellung (Punktgröße, Dichte, Gitter, EDL, Symbolgröße)
display="kunde"

; ▦ Umgebung (Karte, Wasser, Himmel, Beschriftungen, Position)
map="kunde"

; ― Höhen-Hilfslinie (Referenzebene)
guide="kunde"

; ↔ Bewegen (Versatz, Rotation, Skalierung)
transform="dev"

; ◆ Notizen / Markierungen (Befunde im Modell)
notes="kunde"

; ⚙ Fachwerkzeuge (Panel) – öffnet das Panel in Programm und Browser-Viewer; jede Kachel darin (Abschnitt „Fachwerkzeuge“) braucht zusätzlich ihre eigene Stufe
devtools="partner"

; =============================================================================
; UNTERE WERKZEUGLEISTE
; =============================================================================

[untere_leiste]

; ◎ ▽ ◁ ⟲ Ansicht (Orbit, Oben, Seite, Zurücksetzen)
ansicht="demo"

; △ Messen (Distanz + Höhenunterschied)
messen="partner"

; ▣ Clipping (Ausschnitt-Box je Ebene)
clip="dev"

; ☀ Licht (frei platzierbare Sonne)
licht="kunde"

; ▧ Höhenfarben (Farbskala ein-/ausblenden)
hoehenfarben="kunde"

; ◢ Höhenprofil-Schnitt (P1–P16, Differenz, Wasserspiegel)
profil="kunde"

; ▥ Raster-Schnitt (2–16 Profile auf einmal)
raster="partner"

; ◫ Split-Vergleich (vorher/nachher)
split="kunde"

; ◉ Foto (Screenshot als PNG)
foto_screenshot="kunde"

; ◳ Bauwerksvergleich (Zeitvergleich, Differenz-Heatmap, Hinweisbereiche) – automatisierte VORANALYSE, ersetzt keine fachliche Prüfung
zwilling="dev"

; =============================================================================
; RECHTES DOCK
; =============================================================================

[rechtes_dock]

; ≡ Ebenenliste – „gesperrt“ blendet das ganze rechte Dock aus
ebenen="kunde"

; ▤ Eigenschaften-Tabelle (Teil desselben Docks, folgt „ebenen“)
eigenschaften="kunde"

; =============================================================================
; OBERFLÄCHE – UNTER-WERKZEUGE
; =============================================================================

[oberflaeche]

; ▦ Karte als Grundfläche (basemap.at / OSM / Satellit)
karte="kunde"

; ≈ Wasseroberfläche (animiert, Wasserspiegel)
wasser="kunde"

; ☁ Himmel (Wolken, Tageslicht)
himmel="kunde"

; ✦ Beschriftungen (Ortsnamen als 3D-Schilder)
beschriftungen="kunde"

; ◎ Position (Koordinaten-Anzeige)
position="kunde"

; =============================================================================
; FACHWERKZEUGE – KACHELN DES PANELS (NUR MIT „DEVTOOLS“ ERREICHBAR)
; =============================================================================

[entwickler_panel]

; ◈ Bezugssystem festlegen: ◎ aus Koordinaten schätzen
crs_erkennen="partner"

; ◔ Aufnahme dokumentieren: Felder automatisch füllen
meta_auto="dev"

; 🌊 Abflussdaten und Wasserstand abrufen (Open-Meteo/GloFAS, Pegel)
abflussdaten="dev"

; 📷 Aufnahmen einbinden: Drohnenfotos (Pins, Fotoliste)
fotoliste="dev"

; ▤ Einsatzbericht (PDF-Vorschau und -Export)
bericht="dev"

; ⇉ Komplettes Übergabepaket (DXF, LandXML, Befund-CSV, DGM, Profile, Querprofile, .waka)
uebergabepaket="dev"

; ◍ Web-Vorschau (ausgedünntes Browser-Paket)
web_export="dev"

; ◫ Sonar-Bildwand (eigene Kachel: Mosaik am Pfeiler unter Wasser, Ausschnitt, Bearbeiten)
bildwand="dev"

; ◱ RealityImage: Drohnenfotos für RealityScan prüfen, auswählen, kopieren (nur Desktop)
realityimage="dev"

; ▧ Höhenlinien (topografisch, mit Höhenzahlen und Hoch-/Tiefpunkten)
hoehenlinien="partner"

; ⛰ Volumenmessung (Volumen, Fassungsvermögen, Veränderung; Körper im 3-D, Prüfbericht, lokale API)
massen="partner"

; ◑ Kamerafahrt (Flug am Ring, Video)
kamerafahrt="partner"

; =============================================================================
; EXPORT-FENSTER (KNOPF OBEN RECHTS, SEIT 3.0.0)
; =============================================================================

[export]

; ✎ DXF-Zeichnung R12 (Befunde, Messungen, Profile, Höhenlinien, Bildwände)
export_dxf="partner"

; △ LandXML-Geländemodell (TIN aus den Messpunkten) – Civil 3D, Trimble
export_landxml="partner"

; ▤ WAKATEC-Datenpaket .waka (Desktop, volle Auflösung)
export_waka_desktop="kunde"

; ◍ Datenpaket für den Online-Viewer (_Web.waka, ausgedünnt)
export_waka_web="kunde"

; ⛁ LAS-Punktwolke (LAS 1.2, mit Klassen über 31 LAS 1.4; Bezugssystem in der Datei) – CloudCompare, QGIS, PDAL
export_las="partner"

; ⛁ LAZ-Punktwolke (komprimiert, laszip64.exe; nur Desktop)
export_laz="partner"

; ⛁ Textpunktwolke (E N H R G B I, Kopf mit Bezugssystem)
export_xyz="partner"

; ▦ Raster-DGM (GeoTIFF Float32; ohne Lagesystem ESRI-ASCII .asc)
export_geotiff="partner"

; ◈ Shapefiles (PointZ/PolyLineZ + DBF/CPG/PRJ) – QGIS, ArcGIS
export_shp="partner"

; ◈ GeoPackage (alle GIS-Ebenen in einer Datei)
export_gpkg="partner"

; ▤ Befundliste CSV + Befund-Fotos (Fotos/)
export_csv="partner"

; ◢ Höhen- und Querprofile (CSV, Profil-Blätter als PDF)
export_profile="partner"

; ▤ Einsatzbericht PDF
export_bericht="dev"

; ▦ Lageplan mit Kartengrund (PDF im Maßstab + GeoTIFF)
export_lageplan="kunde"

; ⛰ Volumen-Blatt (PDF der Volumenmessung: 3-D-Ansicht, Kennwerte, Lageausschnitt)
export_volumen="partner"
